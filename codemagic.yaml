workflows:
  build-customer-app:
    name: Build Foodie Customer App
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build Foodie_Customer APK
        script: |
          flutter packages pub get
          flutter build apk --release
    artifacts:
      - build/app/outputs/apk/release/app-release.apk